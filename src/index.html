<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=0, user-scalable=no, viewport-fit=cover">
    <!--
      Run the iOS Home-Screen app full-screen (standalone). On iOS 16.4+ the
      manifest's `display: standalone` already launches it standalone regardless
      of this tag, but "yes" is what enables the black-translucent status bar the
      safe-area CSS is built around — without it, content renders under the notch.
      (Note: a standalone WASM app this heavy can hit iOS's per-app memory limit
      on low-memory devices; if that recurs, the fix is reducing startup memory,
      not this tag, since modern iOS is standalone either way.)
    -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stremio">
    <link rel="icon" type="image/x-icon" href="<%= htmlWebpackPlugin.options.faviconsPath %>/favicon.ico">
    <link rel="manifest" href="manifest.json" />
    <title>Stremio - Freedom to Stream</title>
    <%= htmlWebpackPlugin.tags.headTags %>
</head>

<body>
    <div id="app"></div>
    <%= htmlWebpackPlugin.tags.bodyTags %>
    <script src="//www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script async src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
    <script data-goatcounter="https://stremio-netflix.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>

</html>
