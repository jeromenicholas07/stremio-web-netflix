<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=0, user-scalable=no, viewport-fit=cover">
    <!--
      iOS home-screen launch mode. This heavy WASM app exceeds the *smaller*
      memory budget iOS gives standalone (full-screen) web apps, so a Home-Screen
      PWA crashes a few seconds after launch ("A problem repeatedly occurred"),
      while the same page runs fine in a normal Safari tab. Setting this to "no"
      makes the Home-Screen icon open in the Safari-tab context that works (at the
      cost of showing Safari's UI chrome). This tag is iOS-only — Android/desktop
      ignore it and keep the manifest's `display: standalone` behavior.
    -->
    <meta name="apple-mobile-web-app-capable" content="no">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stremio">
    <link rel="icon" type="image/x-icon" href="<%= htmlWebpackPlugin.options.faviconsPath %>/favicon.ico">
    <link rel="manifest" href="manifest.json" />
    <title>Stremio - Freedom to Stream</title>
    <%= htmlWebpackPlugin.tags.headTags %>
</head>

<body>
    <div id="app"></div>
    <%= htmlWebpackPlugin.tags.bodyTags %>
    <script src="//www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script async src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
    <script data-goatcounter="https://stremio-netflix.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>

</html>
