name: GitHub Pages Cleanup

# The weekly schedule is intentionally removed. This fork deploys the FULL site
# (commit-hash asset dirs plus favicons/fonts/images/screenshots/scripts/styles/
# binaries) to the gh-pages ROOT — not per-branch preview subdirectories. The
# branch-based cleanup below therefore treated every site directory as a stale
# branch preview and deleted the whole site every Sunday, white-screening it.
# Left as manual-only, and the delete step now hard-protects the site assets.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Delete directories that don't have existing branch
        run: |
          branches=( $(git branch -r | grep origin | grep -v HEAD | sed 's|origin/||') )
          declare -p branches

          find . -mindepth 1 -maxdepth 2 -type d -not -path '*/\.*' | while read -r dir; do
              path="${dir#./}"

              # Hard-protect the site assets. The full site lives at the gh-pages
              # root, so never delete the fixed asset dirs or any commit-hash dir
              # (or anything nested under them).
              top="${path%%/*}"
              case "$top" in
                  favicons|fonts|images|screenshots|scripts|styles|binaries|.well-known)
                      continue ;;
              esac
              if [[ "$top" =~ ^[0-9a-f]{7,}$ ]]; then
                  continue
              fi

              if [[ " ${branches[*]} " =~ " $path " ]]; then
                  continue
              fi

              keep_parent=false
              for branch in "${branches[@]}"; do
                  if [[ "$branch" == "$path/"* ]]; then
                      keep_parent=true
                      break
                  fi
              done

              if ! $keep_parent; then
                  echo "Deleting $dir"
                  rm -rf "$dir"
              fi
          done

      - name: Commit and push
        run: |
          git config --global user.name 'GitHub Pages Cleanup'
          git config --global user.email 'actions@stremio.com'
          git add -A
          git diff --cached --quiet || git commit -m "cleanup"
          git push origin gh-pages
