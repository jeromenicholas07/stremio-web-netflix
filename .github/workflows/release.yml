name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install
      - name: Build
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: pnpm build
      - name: Zip build artifact
        run: zip -r stremio-web.zip ./build
      - name: Upload build artifact to GitHub release assets
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: stremio-web.zip
          asset_name: stremio-web.zip
          tag: ${{ github.ref }}
          overwrite: true

  launcher-full:
    # Produces a single self-contained StremioLauncherFULL.exe with Prowlarr,
    # portable Node, the incognito addon, and the base StremioLauncher.exe
    # embedded as a zip resource. No sibling files needed at runtime.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node for addon deps
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Compile base StremioLauncher.exe
        shell: pwsh
        run: |
          $csc = Get-ChildItem -Path "C:\Windows\Microsoft.NET\Framework64" -Filter "csc.exe" -Recurse |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $csc) { throw "csc.exe not found" }
          & $csc.FullName /target:exe /out:StremioLauncher.exe StremioLauncher.cs
          if ($LASTEXITCODE -ne 0) { throw "StremioLauncher.exe compilation failed" }

      - name: Install addon dependencies (production only)
        shell: pwsh
        working-directory: stremio-adult-addon
        run: npm install --omit=dev

      - name: Download portable Node.js
        shell: pwsh
        run: |
          Write-Host "Downloading portable Node.js..."
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.18.1/node-v20.18.1-win-x64.zip" -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-extract
          $nodeRoot = Get-ChildItem node-extract -Directory | Select-Object -First 1
          Rename-Item $nodeRoot.FullName "node-portable"

      - name: Download Prowlarr
        shell: pwsh
        run: |
          Write-Host "Downloading Prowlarr..."
          Invoke-WebRequest -Uri "https://github.com/Prowlarr/Prowlarr/releases/download/v1.28.2.4885/Prowlarr.master.1.28.2.4885.windows-core-x64.zip" -OutFile prowlarr.zip
          Expand-Archive -Path prowlarr.zip -DestinationPath prowlarr-extract

      - name: Stage payload
        shell: pwsh
        run: |
          $payload = "payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          # Base launcher binary (extracted side-by-side with the FULL launcher at runtime)
          Copy-Item StremioLauncher.exe "$payload\"

          # Addon source + production node_modules
          New-Item -ItemType Directory -Force -Path "$payload\stremio-adult-addon" | Out-Null
          Copy-Item stremio-adult-addon\index.js          "$payload\stremio-adult-addon\"
          Copy-Item stremio-adult-addon\package.json      "$payload\stremio-adult-addon\"
          Copy-Item stremio-adult-addon\package-lock.json "$payload\stremio-adult-addon\" -ErrorAction SilentlyContinue
          Copy-Item stremio-adult-addon\src               "$payload\stremio-adult-addon\" -Recurse
          Copy-Item stremio-adult-addon\node_modules      "$payload\stremio-adult-addon\" -Recurse

          # Portable Node — just node.exe, that's all the addon needs
          New-Item -ItemType Directory -Force -Path "$payload\node" | Out-Null
          Copy-Item node-extract\node-portable\node.exe   "$payload\node\"

          # Portable Prowlarr
          $prowlarrRoot = Get-ChildItem prowlarr-extract -Directory | Select-Object -First 1
          if ($prowlarrRoot) {
            Copy-Item $prowlarrRoot.FullName "$payload\prowlarr" -Recurse
          } else {
            # If the archive extracted flat, copy everything
            Copy-Item prowlarr-extract "$payload\prowlarr" -Recurse
          }

          # Zip the whole payload into a single resource for embedding
          if (Test-Path payload.zip) { Remove-Item payload.zip }
          Compress-Archive -Path "$payload\*" -DestinationPath payload.zip -CompressionLevel Optimal

          $size = (Get-Item payload.zip).Length / 1MB
          Write-Host ("payload.zip size: {0:N1} MB" -f $size)

      - name: Compile StremioLauncherFULL.exe with embedded payload
        shell: pwsh
        run: |
          $csc = Get-ChildItem -Path "C:\Windows\Microsoft.NET\Framework64" -Filter "csc.exe" -Recurse |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $csc) { throw "csc.exe not found" }

          # Reference assemblies for System.IO.Compression (ZipArchive) —
          # .NET Framework 4.5+ ships these as separate DLLs.
          $refDir = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5"
          if (-not (Test-Path $refDir)) {
            $refDir = Get-ChildItem "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework" -Directory |
                      Where-Object { Test-Path (Join-Path $_.FullName 'System.IO.Compression.FileSystem.dll') } |
                      Select-Object -Last 1 -ExpandProperty FullName
          }
          if (-not $refDir) { throw "Could not locate .NETFramework reference assemblies for System.IO.Compression" }

          & $csc.FullName `
            /target:exe `
            /out:StremioLauncherFULL.exe `
            /resource:payload.zip,StremioLauncherFULL.payload.zip `
            /r:"$refDir\System.IO.Compression.dll" `
            /r:"$refDir\System.IO.Compression.FileSystem.dll" `
            StremioLauncherFULL.cs
          if ($LASTEXITCODE -ne 0) { throw "StremioLauncherFULL.exe compilation failed" }

          $size = (Get-Item StremioLauncherFULL.exe).Length / 1MB
          Write-Host ("StremioLauncherFULL.exe size: {0:N1} MB" -f $size)

      - name: Upload StremioLauncher.exe
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: StremioLauncher.exe
          asset_name: StremioLauncher.exe
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload StremioLauncherFULL.exe
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: StremioLauncherFULL.exe
          asset_name: StremioLauncherFULL.exe
          tag: ${{ github.ref }}
          overwrite: true
